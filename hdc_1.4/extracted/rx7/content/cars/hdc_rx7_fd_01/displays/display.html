<!DOCTYPE html>
<html lang="en">

<head>
    <script src='../../common_assets/displays/js/cohtml.js'></script>
    <script src='../../common_assets/displays/js/displays.js'></script>

    <link rel='stylesheet' type='text/css' href='../../common_assets/displays/css/common.css'>
    <link rel='stylesheet' type='text/css' href='display.css'>

    <script src='display.js'></script>
</head>

<body class="cardisplay"
    data-mode="off"
    data-bind-car="CarDisplay.process({{ModelCurrentCar}})">

    <div id="common" class="pAbsolute">
        <div id="dash" class="pAbsolute">

            <div id="odometer" data-bind-value="{{ModelCurrentCar}}.total_km">1000000</div>
            <div id="trip" data-bind-value="{{ModelCurrentCar}}.current_km.toFixed(1)">100.0</div>
        </div>

        <div id="radio" class="pAbsolute">
            <div id="time" data-bind-value="CarDisplay.convert.timeOfDayToTime({{ModelCurrentCar}})">
            </div>

        </div>
    </div>

</body>

</html>
