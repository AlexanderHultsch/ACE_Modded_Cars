<!DOCTYPE html>
<html lang="en">

<head>
    <script src='../../common_assets/displays/js/cohtml.js'></script>
    <script src='../../common_assets/displays/js/displays.js'></script>

    <link rel='stylesheet' type='text/css' href='../../common_assets/displays/css/common.css'>
    <link rel='stylesheet' type='text/css' href='display.css'>

    <script src='display.js'></script>
</head>

<body class="cardisplay"
    data-mode="off"
    data-bind-car="CarDisplay.process({{ModelCurrentCar}})">

    <div id="common" class="pAbsolute">
        <div id="ambient"><span data-bind-value="">+</span><span class="value" data-bind-value="Math.abs({{ModelCurrentCar}}.air_temperature_c).toFixed(1)">26.0</span><span class="degrees">°</span><span class="units">C</span></div>

        <div id="radio"><span class="prefix">U1</span><span class="value">91.0</span></div>
        <div id="clock">
            <div class="unstretch" data-bind-value="ksUI.formatTimeExt(Math.min(3599000, {{ModelCurrentCar}}.current_lap_time_ms),3, false, 0)">24:50</div>
        </div>

    </div>
</body>

</html>
